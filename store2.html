<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>EX STYLE — Fashion Online Store</title>
  <meta name="description" content="EX STYLE — Trendy fashion for everyone. Shop women, men, kids and beauty at the best prices."/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',Arial,sans-serif;background:#f4f5f7;color:#111;min-height:100vh}

    /* HEADER */
    .header{background:#fff;padding:0 16px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 0 rgba(0,0,0,.07)}
    .logo{font-size:20px;font-weight:900;letter-spacing:.5px}
    .logo em{color:#00c4b4;font-style:normal}
    .hdr-right{display:flex;align-items:center;gap:6px}
    .hdr-btn{background:#f0f0f0;color:#555;border:none;padding:6px 12px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
    .hdr-cart-btn{position:relative;background:none;border:none;font-size:22px;color:#111;cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
    .cart-badge{position:absolute;top:3px;right:2px;background:#00c4b4;color:#fff;font-size:9px;font-weight:900;min-width:17px;height:17px;border-radius:20px;display:flex;align-items:center;justify-content:center;padding:0 3px}

    /* HERO */
    .hero{background:linear-gradient(135deg,#00c4b4 0%,#0099cc 100%);padding:40px 20px 36px;color:#fff;position:relative;overflow:hidden}
    .hero::after{content:'';position:absolute;right:-40px;bottom:-40px;width:200px;height:200px;background:rgba(255,255,255,.07);border-radius:50%}
    .hero::before{content:'';position:absolute;right:40px;bottom:20px;width:100px;height:100px;background:rgba(255,255,255,.05);border-radius:50%}
    .hero-tag{display:inline-block;background:rgba(255,255,255,.22);backdrop-filter:blur(4px);padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:12px;letter-spacing:.5px}
    .hero-title{font-size:38px;font-weight:900;line-height:1.15;margin-bottom:10px}
    .hero-sub{font-size:14px;opacity:.88;margin-bottom:22px;line-height:1.5}
    .hero-btns{display:flex;gap:10px;flex-wrap:wrap}
    .hero-btn-primary{background:#fff;color:#00c4b4;border:none;padding:11px 26px;border-radius:24px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.15)}
    .hero-btn-secondary{background:rgba(255,255,255,.18);color:#fff;border:1.5px solid rgba(255,255,255,.5);padding:11px 22px;border-radius:24px;font-size:14px;font-weight:700;cursor:pointer}

    /* FEATURE STRIP */
    .features{display:flex;overflow-x:auto;gap:10px;padding:14px 14px 10px;scrollbar-width:none;background:#fff;margin-top:0}
    .features::-webkit-scrollbar{display:none}
    .feat{display:flex;align-items:center;gap:7px;background:#f7fffe;border:1px solid #d4f5f2;border-radius:12px;padding:9px 14px;white-space:nowrap;flex-shrink:0}
    .feat i{color:#00c4b4;font-size:15px}
    .feat span{font-size:11px;font-weight:700;color:#333}

    /* CATEGORIES */
    .section-pad{padding:16px 14px 8px;font-size:16px;font-weight:900;color:#111}
    .cats{display:flex;gap:8px;overflow-x:auto;padding:0 14px 12px;scrollbar-width:none}
    .cats::-webkit-scrollbar{display:none}
    .cat-pill{padding:8px 18px;background:#fff;border:1.5px solid #e0e0e0;border-radius:24px;font-size:12px;font-weight:700;color:#555;cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0}
    .cat-pill.active{background:#00c4b4;border-color:#00c4b4;color:#fff;box-shadow:0 3px 12px rgba(0,196,180,.3)}

    /* PRODUCTS */
    .prod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 12px 90px}
    .prod-card{background:#fff;border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;box-shadow:0 1px 6px rgba(0,0,0,.05)}
    .prod-card:active{transform:scale(.97)}
    .prod-img-wrap{position:relative;aspect-ratio:1;overflow:hidden;background:#f0f0f0}
    .prod-img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
    .prod-card:hover .prod-img-wrap img{transform:scale(1.06)}
    .disc-badge{position:absolute;top:8px;left:8px;background:#00c4b4;color:#fff;font-size:10px;font-weight:800;padding:3px 9px;border-radius:12px}
    .tag-badge{position:absolute;top:8px;right:8px;background:#ff4757;color:#fff;font-size:9px;font-weight:800;padding:2px 7px;border-radius:10px}
    .prod-body{padding:10px 10px 12px}
    .prod-name{font-size:12px;font-weight:600;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
    .prod-prices{display:flex;align-items:baseline;gap:5px;margin-bottom:3px}
    .price-now{font-size:15px;font-weight:900;color:#00c4b4}
    .price-was{font-size:11px;color:#bbb;text-decoration:line-through}
    .prod-rating{font-size:11px;color:#f7b731;margin-bottom:7px}
    .add-btn{width:100%;background:linear-gradient(135deg,#00c4b4,#0099cc);color:#fff;border:none;padding:8px;font-size:12px;font-weight:700;cursor:pointer;border-radius:10px;transition:opacity .2s}
    .add-btn:active{opacity:.8}

    /* CART SIDEBAR */
    .cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;display:none}
    .cart-overlay.open{display:block}
    .cart-panel{position:fixed;right:0;top:0;bottom:0;width:min(340px,100vw);background:#fff;z-index:201;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-4px 0 24px rgba(0,0,0,.12)}
    .cart-panel.open{transform:translateX(0)}
    .cart-hdr{padding:16px 18px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between}
    .cart-hdr-title{font-size:16px;font-weight:900;color:#111}
    .cart-close-btn{background:none;border:none;font-size:20px;cursor:pointer;color:#bbb;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
    .cart-list{flex:1;overflow-y:auto;padding:12px 14px}
    .cart-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f5f5f5}
    .ci-img{width:54px;height:54px;border-radius:10px;object-fit:cover;background:#f0f0f0;flex-shrink:0}
    .ci-info{flex:1;min-width:0}
    .ci-name{font-size:12px;font-weight:600;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ci-price{font-size:13px;font-weight:900;color:#00c4b4;margin-top:3px}
    .ci-qty-row{display:flex;align-items:center;gap:7px;margin-top:6px}
    .qty-btn{background:#f2f2f2;border:none;width:25px;height:25px;border-radius:7px;cursor:pointer;font-size:14px;font-weight:700;color:#444}
    .qty-num{font-size:13px;font-weight:700;min-width:20px;text-align:center}
    .ci-del{background:none;border:none;color:#ddd;cursor:pointer;font-size:15px;padding:4px;margin-left:auto}
    .cart-empty-state{text-align:center;padding:50px 20px;color:#ccc}
    .cart-empty-state i{font-size:44px;margin-bottom:12px;display:block}
    .cart-empty-state span{font-size:13px}
    .cart-footer{padding:16px 18px;border-top:1px solid #f0f0f0;background:#fff}
    .cart-total-row{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:900;color:#111;margin-bottom:14px}
    .checkout-btn{width:100%;background:linear-gradient(135deg,#00c4b4,#0099cc);color:#fff;border:none;padding:14px;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 16px rgba(0,196,180,.35)}

    /* PRODUCT MODAL */
    .modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;display:none;align-items:flex-end;justify-content:center}
    .modal-ov.open{display:flex}
    .modal-sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-height:92vh;overflow-y:auto;position:relative}
    .modal-img{width:100%;aspect-ratio:1;object-fit:cover;background:#f0f0f0}
    .modal-content{padding:18px 18px 32px}
    .modal-name{font-size:17px;font-weight:900;color:#111;margin-bottom:8px}
    .modal-price-row{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
    .modal-price-now{font-size:24px;font-weight:900;color:#00c4b4}
    .modal-price-was{font-size:14px;color:#bbb;text-decoration:line-through}
    .modal-disc{font-size:12px;font-weight:700;color:#fff;background:#00c4b4;padding:2px 9px;border-radius:10px}
    .modal-info-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    .modal-info-pill{background:#f4f5f7;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;color:#555}
    .modal-add-btn{width:100%;background:linear-gradient(135deg,#00c4b4,#0099cc);color:#fff;border:none;padding:14px;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px}
    .modal-close{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.35);color:#fff;border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;z-index:1}

    /* FLOAT */
    .float-cart{position:fixed;bottom:22px;right:16px;background:linear-gradient(135deg,#00c4b4,#0099cc);color:#fff;border:none;width:56px;height:56px;border-radius:50%;box-shadow:0 4px 18px rgba(0,196,180,.45);cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;z-index:99;transition:transform .2s}
    .float-cart:active{transform:scale(.9)}
    .float-badge{position:absolute;top:-3px;right:-3px;background:#ff4757;color:#fff;font-size:10px;font-weight:900;min-width:19px;height:19px;border-radius:20px;display:flex;align-items:center;justify-content:center;padding:0 3px}

    /* TOAST */
    .toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(16px);background:#111;color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;transition:all .28s;z-index:999;pointer-events:none;white-space:nowrap}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @media(min-width:480px){.prod-grid{grid-template-columns:repeat(3,1fr)}}
    @media(min-width:700px){.prod-grid{grid-template-columns:repeat(4,1fr)}}
  </style>
</head>
<body>

<div class="header">
  <div class="logo">EX <em>STYLE</em></div>
  <div class="hdr-right">
    <a href="index.html" class="hdr-btn"><i class="fas fa-store"></i> Main Store</a>
    <button class="hdr-cart-btn" onclick="openCart()">
      <i class="fas fa-bag-shopping"></i>
      <span class="cart-badge" id="cartBadge" style="display:none">0</span>
    </button>
  </div>
</div>

<div class="hero">
  <div class="hero-tag">✨ NEW ARRIVALS</div>
  <div class="hero-title">Fresh<br/>Fashion</div>
  <div class="hero-sub">Style that fits every mood.<br/>Starting from SAR 9</div>
  <div class="hero-btns">
    <button class="hero-btn-primary" onclick="scrollTo({top:document.getElementById('prodSec').offsetTop-60,behavior:'smooth'})">Shop Now</button>
    <button class="hero-btn-secondary" onclick="filterCat(document.querySelector('[data-cat=women]'),'women')">Women's →</button>
  </div>
</div>

<div class="features">
  <div class="feat"><i class="fas fa-truck"></i><span>Free Delivery 100+ SAR</span></div>
  <div class="feat"><i class="fas fa-rotate-left"></i><span>7 Day Returns</span></div>
  <div class="feat"><i class="fas fa-shield-halved"></i><span>Secure Payment</span></div>
  <div class="feat"><i class="fab fa-whatsapp"></i><span>WhatsApp Order</span></div>
</div>

<div class="cats" style="padding:14px 14px 12px">
  <div class="cat-pill active" data-cat="all" onclick="filterCat(this,'all')">All</div>
  <div class="cat-pill" data-cat="women" onclick="filterCat(this,'women')">Women</div>
  <div class="cat-pill" data-cat="men" onclick="filterCat(this,'men')">Men</div>
  <div class="cat-pill" data-cat="kids" onclick="filterCat(this,'kids')">Kids</div>
  <div class="cat-pill" data-cat="beauty" onclick="filterCat(this,'beauty')">Beauty</div>
  <div class="cat-pill" data-cat="shoes" onclick="filterCat(this,'shoes')">Shoes</div>
  <div class="cat-pill" data-cat="bags" onclick="filterCat(this,'bags')">Bags</div>
  <div class="cat-pill" data-cat="home" onclick="filterCat(this,'home')">Home</div>
  <div class="cat-pill" data-cat="electronics" onclick="filterCat(this,'electronics')">Electronics</div>
</div>

<div class="section-pad" id="prodSec">All Products</div>
<div class="prod-grid" id="prodGrid"></div>

<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<div class="cart-panel" id="cartPanel">
  <div class="cart-hdr">
    <span class="cart-hdr-title">My Cart</span>
    <button class="cart-close-btn" onclick="closeCart()"><i class="fas fa-times"></i></button>
  </div>
  <div class="cart-list" id="cartList"></div>
  <div class="cart-footer" id="cartFooter" style="display:none">
    <div class="cart-total-row"><span>Total</span><span id="cartTotalAmt">SAR 0</span></div>
    <button class="checkout-btn" onclick="doCheckout()">
      <i class="fab fa-whatsapp"></i> Order via WhatsApp
    </button>
  </div>
</div>

<div class="modal-ov" id="modalOv" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet">
    <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    <img class="modal-img" id="mImg" src="" alt=""/>
    <div class="modal-content">
      <div class="modal-name" id="mName"></div>
      <div class="modal-price-row">
        <span class="modal-price-now" id="mPrice"></span>
        <span class="modal-price-was" id="mOrig"></span>
        <span class="modal-disc" id="mDisc"></span>
      </div>
      <div class="modal-info-row" id="mInfo"></div>
      <button class="modal-add-btn" onclick="addModalItem()">
        <i class="fas fa-bag-shopping"></i> Add to Cart
      </button>
    </div>
  </div>
</div>

<button class="float-cart" style="position:fixed;bottom:22px;right:16px" onclick="openCart()">
  <i class="fas fa-bag-shopping"></i>
  <span class="float-badge" id="floatBadge" style="display:none">0</span>
</button>

<div class="toast" id="toast"></div>

<script src="products.js"></script>
<script>
(function(){try{const c=JSON.parse(localStorage.getItem('exg_products_custom')||'{}'),a=JSON.parse(localStorage.getItem('exg_products_added')||'[]'),d=JSON.parse(localStorage.getItem('exg_products_deleted')||'[]');for(let i=PRODUCTS.length-1;i>=0;i--){if(d.includes(PRODUCTS[i].id))PRODUCTS.splice(i,1);else if(c[PRODUCTS[i].id])Object.assign(PRODUCTS[i],c[PRODUCTS[i].id]);}PRODUCTS.push(...a);}catch(e){}})();

let cart = JSON.parse(localStorage.getItem('exstyle_cart') || '[]');
let activeCat = 'all';
let activeModalId = null;

const SAR = p => 'SAR ' + Math.round(p * 0.034).toLocaleString();
const gName = p => p.names?.en || p.nameEn || p.name || '';
const getWA = () => { try{return JSON.parse(localStorage.getItem('exg_settings')||'{}').whatsapp||'966546224029';}catch(e){return'966546224029';} };

function filterCat(el, cat) {
  activeCat = cat;
  document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  renderProds();
}

function renderProds() {
  const list = activeCat === 'all' ? PRODUCTS : PRODUCTS.filter(p => p.category === activeCat);
  const grid = document.getElementById('prodGrid');
  grid.innerHTML = list.length ? list.map(p => `
    <div class="prod-card" onclick="openModal(${p.id})">
      <div class="prod-img-wrap">
        <img src="${p.image||''}" loading="lazy" alt="" onerror="this.style.opacity='.15'"/>
        <span class="disc-badge">-${p.discount}%</span>
        ${p.tag ? `<span class="tag-badge">${p.tag.toUpperCase()}</span>` : ''}
      </div>
      <div class="prod-body">
        <div class="prod-name">${gName(p)}</div>
        <div class="prod-prices"><span class="price-now">${SAR(p.price)}</span><span class="price-was">${SAR(p.originalPrice)}</span></div>
        <div class="prod-rating">★ ${p.rating} (${p.ratingCount})</div>
        <button class="add-btn" onclick="event.stopPropagation();addToCart(${p.id})"><i class="fas fa-plus"></i> Add to Cart</button>
      </div>
    </div>`).join('') : '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#aaa">No products found</div>';
}

function openModal(id) {
  activeModalId = id;
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  document.getElementById('mImg').src = p.image || '';
  document.getElementById('mName').textContent = gName(p);
  document.getElementById('mPrice').textContent = SAR(p.price);
  document.getElementById('mOrig').textContent = SAR(p.originalPrice);
  document.getElementById('mDisc').textContent = '-' + p.discount + '%';
  document.getElementById('mInfo').innerHTML = [
    p.category && `<span class="modal-info-pill">${p.category}</span>`,
    p.rating && `<span class="modal-info-pill">★ ${p.rating}</span>`,
    p.sold && `<span class="modal-info-pill">${p.sold} sold</span>`,
    p.sizes?.length && `<span class="modal-info-pill">${p.sizes.join(' / ')}</span>`,
  ].filter(Boolean).join('');
  document.getElementById('modalOv').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modalOv').classList.remove('open');
  document.body.style.overflow = '';
}
function addModalItem() { if (activeModalId) { addToCart(activeModalId); closeModal(); } }

function addToCart(id) {
  const ex = cart.find(i => i.id === id);
  if (ex) ex.qty++; else cart.push({ id, qty: 1 });
  localStorage.setItem('exstyle_cart', JSON.stringify(cart));
  updateBadges();
  showToast('✓ Added to cart');
}
function changeQty(id, d) {
  const item = cart.find(i => i.id === id);
  if (!item) return;
  item.qty += d;
  if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
  localStorage.setItem('exstyle_cart', JSON.stringify(cart));
  updateBadges(); renderCartList();
}
function removeItem(id) {
  cart = cart.filter(i => i.id !== id);
  localStorage.setItem('exstyle_cart', JSON.stringify(cart));
  updateBadges(); renderCartList();
}
function updateBadges() {
  const n = cart.reduce((s, i) => s + i.qty, 0);
  ['cartBadge','floatBadge'].forEach(id => { const el = document.getElementById(id); if(el){el.textContent=n;el.style.display=n>0?'flex':'none';} });
}
function openCart() { renderCartList(); document.getElementById('cartOverlay').classList.add('open'); document.getElementById('cartPanel').classList.add('open'); }
function closeCart() { document.getElementById('cartOverlay').classList.remove('open'); document.getElementById('cartPanel').classList.remove('open'); }

function renderCartList() {
  const el = document.getElementById('cartList');
  const footer = document.getElementById('cartFooter');
  if (!cart.length) {
    el.innerHTML = '<div class="cart-empty-state"><i class="fas fa-bag-shopping"></i><span>Your cart is empty</span></div>';
    footer.style.display = 'none'; return;
  }
  let total = 0;
  el.innerHTML = cart.map(item => {
    const p = PRODUCTS.find(x => x.id === item.id); if (!p) return '';
    total += p.price * item.qty * 0.034;
    return `<div class="cart-item">
      <img class="ci-img" src="${p.image||''}" onerror="this.style.opacity='.2'"/>
      <div class="ci-info">
        <div class="ci-name">${gName(p)}</div>
        <div class="ci-price">${SAR(p.price)}</div>
        <div class="ci-qty-row">
          <button class="qty-btn" onclick="changeQty(${p.id},-1)">−</button>
          <span class="qty-num">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty(${p.id},1)">+</button>
        </div>
      </div>
      <button class="ci-del" onclick="removeItem(${p.id})"><i class="fas fa-trash"></i></button>
    </div>`;
  }).join('');
  document.getElementById('cartTotalAmt').textContent = 'SAR ' + Math.round(total);
  footer.style.display = 'block';
}

function doCheckout() {
  if (!cart.length) return;
  const lines = cart.map(i => { const p = PRODUCTS.find(x => x.id === i.id); return p ? `• ${gName(p)} ×${i.qty} = ${SAR(p.price * i.qty)}` : ''; }).filter(Boolean);
  const total = cart.reduce((s, i) => { const p = PRODUCTS.find(x => x.id === i.id); return s + (p ? p.price * i.qty * 0.034 : 0); }, 0);
  window.open(`https://wa.me/${getWA()}?text=${encodeURIComponent('🛍️ *EX STYLE Order*\n\n' + lines.join('\n') + '\n\n*Total: SAR ' + Math.round(total) + '*')}`, '_blank');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show';
  setTimeout(() => t.className = 'toast', 2400);
}

document.addEventListener('DOMContentLoaded', () => { renderProds(); updateBadges(); });
</script>
</body>
</html>
