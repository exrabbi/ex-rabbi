<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 48">
  <rect width="90" height="48" rx="9" fill="#fff"/>
  <rect width="90" height="48" rx="9" fill="none" stroke="#f0f0f0" stroke-width="1"/>
  <!-- stc in official deep purple, bold -->
  <text x="25" y="30" text-anchor="middle" fill="#4B0082" font-size="21" font-weight="900"
        font-family="'Arial Black',Arial,sans-serif" letter-spacing="-0.5">stc</text>
  <!-- small square separator (official brand mark) -->
  <rect x="47" y="16" width="6" height="6" rx="1.5" fill="#4B0082"/>
  <!-- pay in official teal-green, slightly lighter weight -->
  <text x="68" y="30" text-anchor="middle" fill="#00C87A" font-size="21" font-weight="700"
        font-family="'Arial Black',Arial,sans-serif" letter-spacing="-0.5">pay</text>
</svg>
