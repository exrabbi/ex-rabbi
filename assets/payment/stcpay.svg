<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 48">
  <!-- White card background -->
  <rect width="90" height="48" rx="8" fill="#fff"/>
  <rect width="90" height="48" rx="8" fill="none" stroke="#e5e5e5" stroke-width="1.5"/>

  <!-- "stc" — official deep purple #4B0082 -->
  <text x="27" y="30" text-anchor="middle" dominant-baseline="middle"
        fill="#4B0082" font-size="20" font-weight="900"
        font-family="'Arial Black','Arial Narrow Bold',Arial,sans-serif"
        letter-spacing="-0.5">stc</text>

  <!-- Official square brand separator -->
  <rect x="47" y="19" width="5.5" height="5.5" rx="1" fill="#4B0082"/>

  <!-- "pay" — official bright teal-green #00B272 -->
  <text x="70" y="30" text-anchor="middle" dominant-baseline="middle"
        fill="#00B272" font-size="20" font-weight="900"
        font-family="'Arial Black','Arial Narrow Bold',Arial,sans-serif"
        letter-spacing="-0.5">pay</text>
</svg>
