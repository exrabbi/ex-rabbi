<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 50">
  <rect width="80" height="50" rx="8" fill="#fff" stroke="#e0e0e0" stroke-width="1.5"/>
  <!-- Blue stripe -->
  <rect x="7" y="10" width="24" height="12" rx="1.5" fill="#2BAEE0"/>
  <!-- Green stripe -->
  <rect x="7" y="28" width="24" height="12" rx="1.5" fill="#72BE44"/>
  <!-- Arabic مدى -->
  <text x="38" y="22" fill="#2d2d2d" font-size="11" font-weight="800"
        font-family="Arial,sans-serif" text-anchor="start">مدى</text>
  <!-- Latin mada -->
  <text x="38" y="38" fill="#2d2d2d" font-size="13" font-weight="900"
        font-family="Arial,sans-serif" text-anchor="start" letter-spacing="0.3">mada</text>
</svg>
