<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 48">
  <!-- Card background -->
  <rect width="90" height="48" rx="8" fill="#fff"/>
  <rect width="90" height="48" rx="8" fill="none" stroke="#e5e5e5" stroke-width="1.5"/>

  <!-- Blue bar — official mada brand color #29ABE2 -->
  <rect x="5" y="7" width="38" height="15" rx="1.5" fill="#29ABE2"/>

  <!-- Green bar — official mada brand color #8DC63F -->
  <rect x="5" y="26" width="38" height="15" rx="1.5" fill="#8DC63F"/>

  <!-- Arabic مدى — near-black, bold -->
  <text x="68" y="18" text-anchor="middle" dominant-baseline="middle"
        fill="#222" font-size="13" font-weight="900"
        font-family="'Tahoma','Segoe UI Arabic',Arial,sans-serif">مدى</text>

  <!-- mada — near-black, bold, matches brand typeface -->
  <text x="68" y="36" text-anchor="middle" dominant-baseline="middle"
        fill="#222" font-size="15" font-weight="900"
        font-family="'Arial Black','Arial Rounded MT Bold',Arial,sans-serif"
        letter-spacing="-0.4">mada</text>
</svg>
