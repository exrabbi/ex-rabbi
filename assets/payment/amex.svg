<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 48">
  <rect width="90" height="48" rx="9" fill="#016FD0"/>
  <!-- Centurion card horizontal lines -->
  <rect x="0" y="0" width="90" height="48" rx="9" fill="url(#ag)" opacity="0.15"/>
  <defs>
    <linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <text x="45" y="19" text-anchor="middle" fill="rgba(255,255,255,.7)" font-size="7" font-weight="700" font-family="Arial,sans-serif" letter-spacing="2">AMERICAN</text>
  <text x="45" y="28" text-anchor="middle" fill="rgba(255,255,255,.7)" font-size="7" font-weight="700" font-family="Arial,sans-serif" letter-spacing="2">EXPRESS</text>
  <text x="45" y="42" text-anchor="middle" fill="#fff" font-size="11" font-weight="900" font-family="Arial,sans-serif" letter-spacing="3">AMEX</text>
</svg>
