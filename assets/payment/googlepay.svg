<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 50">
  <rect width="80" height="50" rx="8" fill="#fff" stroke="#e0e0e0" stroke-width="1.5"/>
  <defs>
    <clipPath id="gc"><circle cx="22" cy="25" r="13"/></clipPath>
  </defs>
  <!-- Google G: base red (top-right) -->
  <circle cx="22" cy="25" r="13" fill="#EA4335"/>
  <!-- Blue: left half -->
  <rect x="9" y="12" width="13" height="26" fill="#4285F4" clip-path="url(#gc)"/>
  <!-- Green: bottom-left quarter -->
  <rect x="9" y="25" width="13" height="13" fill="#34A853" clip-path="url(#gc)"/>
  <!-- Yellow: bottom-right quarter -->
  <rect x="22" y="25" width="13" height="13" fill="#FBBC04" clip-path="url(#gc)"/>
  <!-- White inner ring -->
  <circle cx="22" cy="25" r="7.5" fill="#fff"/>
  <!-- Blue horizontal bar (the flat of the G) -->
  <rect x="22" y="22" width="13" height="6" fill="#4285F4"/>
  <!-- White G opening (left half of bar area = inner circle space) -->
  <rect x="22" y="22" width="7.5" height="6" fill="#fff"/>
  <!-- "Pay" text -->
  <text x="40" y="31" fill="#5F6368" font-size="16" font-weight="600"
        font-family="Arial,sans-serif" letter-spacing="-0.3">Pay</text>
</svg>
