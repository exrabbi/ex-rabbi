<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 50">
  <rect width="80" height="50" rx="8" fill="#fff" stroke="#e0e0e0" stroke-width="1.5"/>
  <!-- Binance diamond logo (5 rotated squares) -->
  <g fill="#F3BA2F" transform="translate(13,25) scale(0.82)">
    <!-- center -->
    <polygon points="0,-5.5 5.5,0 0,5.5 -5.5,0"/>
    <!-- top -->
    <polygon points="0,-14 5.5,-8.5 0,-3 -5.5,-8.5"/>
    <!-- right -->
    <polygon points="8.5,-5.5 14,0 8.5,5.5 3,0"/>
    <!-- bottom -->
    <polygon points="0,3 5.5,8.5 0,14 -5.5,8.5"/>
    <!-- left -->
    <polygon points="-3,0 -8.5,-5.5 -14,0 -8.5,5.5"/>
  </g>
  <!-- BINANCE text -->
  <text x="31" y="30" fill="#F3BA2F" font-size="11.5" font-weight="900"
        font-family="'Arial Black',Arial,sans-serif" letter-spacing="0.5">BINANCE</text>
</svg>
