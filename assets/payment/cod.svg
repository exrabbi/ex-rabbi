<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 50">
  <rect width="80" height="50" rx="8" fill="#fff" stroke="#e8e8e8" stroke-width="1"/>
  <!-- Bill/envelope shape -->
  <rect x="14" y="11" width="52" height="32" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <!-- Dollar circle -->
  <circle cx="40" cy="27" r="10" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="40" y="32" text-anchor="middle" fill="#16a34a" font-size="13" font-weight="900" font-family="Arial,Helvetica,sans-serif">$</text>
  <!-- Lines on bill -->
  <line x1="18" y1="17" x2="28" y2="17" stroke="#16a34a" stroke-width="1.2" opacity="0.5"/>
  <line x1="52" y1="17" x2="62" y2="17" stroke="#16a34a" stroke-width="1.2" opacity="0.5"/>
  <line x1="18" y1="37" x2="28" y2="37" stroke="#16a34a" stroke-width="1.2" opacity="0.5"/>
  <line x1="52" y1="37" x2="62" y2="37" stroke="#16a34a" stroke-width="1.2" opacity="0.5"/>
</svg>
