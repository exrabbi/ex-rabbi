<svg viewBox="0 0 80 50" xmlns="http://www.w3.org/2000/svg">
  <rect width="80" height="50" rx="8" fill="#fff" stroke="#e8e8e8" stroke-width="1.5"/>
  <!-- Outer ring -->
  <circle cx="40" cy="25" r="19" fill="#004A97"/>
  <!-- Left inner oval (creates left wing) -->
  <ellipse cx="34" cy="25" rx="12" ry="19" fill="#fff"/>
  <!-- Right inner oval (creates right wing) -->
  <ellipse cx="46" cy="25" rx="12" ry="19" fill="#fff"/>
  <!-- Center overlap restore -->
  <ellipse cx="40" cy="25" rx="6" ry="19" fill="#004A97"/>
</svg>
