<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#e91e8c"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Subtle top shine -->
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Shine overlay top half -->
  <rect width="512" height="260" rx="112" fill="url(#sh)"/>

  <!-- X mark: two thick crossed rounded bars -->
  <!-- Bar 1: top-left → bottom-right (+45°) -->
  <rect x="212" y="66" width="88" height="380" rx="44"
        fill="white"
        transform="rotate(45 256 256)"/>
  <!-- Bar 2: top-right → bottom-left (-45°) -->
  <rect x="212" y="66" width="88" height="380" rx="44"
        fill="white"
        transform="rotate(-45 256 256)"/>
</svg>
