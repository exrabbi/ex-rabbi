<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d0a1e"/>
      <stop offset="100%" stop-color="#160a2a"/>
    </linearGradient>
    <linearGradient id="pk" x1="0" y1="0" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e91e8c"/>
      <stop offset="100%" stop-color="#c4167a"/>
    </linearGradient>
  </defs>

  <!-- Background: dark luxury squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- Subtle inner glow ring -->
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none"
        stroke="rgba(233,30,140,0.18)" stroke-width="2"/>

  <!-- Bold "EX" wordmark — white, centered -->
  <text x="256" y="298"
    font-family="Arial Black, 'Arial Bold', sans-serif"
    font-weight="900"
    font-size="232"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="-10">EX</text>

  <!-- Pink accent bar — precision underline -->
  <rect x="100" y="330" width="312" height="14" rx="7" fill="url(#pk)"/>

  <!-- "GLOBAL" small label — pink, spaced -->
  <text x="256" y="410"
    font-family="Arial, sans-serif"
    font-weight="700"
    font-size="56"
    fill="#e91e8c"
    text-anchor="middle"
    letter-spacing="18"
    opacity="0.92">GLOBAL</text>
</svg>
