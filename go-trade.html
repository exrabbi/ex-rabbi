<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EX Trade — Loading...</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e6edf3;font-family:Inter,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px}
.logo{font-size:28px;font-weight:800;color:#fff}.logo span{color:#00c87a}
.spinner{width:40px;height:40px;border:3px solid #30363d;border-top-color:#00c87a;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
p{font-size:13px;color:#8b949e}
</style>
</head>
<body>
<div class="logo">EX<span>Trade</span></div>
<div class="spinner"></div>
<p id="msg">Cache পরিষ্কার করা হচ্ছে...</p>
<script>
async function clearAndGo() {
  try {
    // Unregister all service workers
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    // Clear all caches
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    document.getElementById('msg').textContent = 'সম্পন্ন! Trading Platform খুলছে...';
  } catch(e) {
    document.getElementById('msg').textContent = 'Redirecting...';
  }
  // Go to trade.html
  setTimeout(() => { window.location.replace('trade.html'); }, 800);
}
clearAndGo();
</script>
</body>
</html>
